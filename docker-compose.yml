services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5002:5000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://192.168.78.129:5002
    ports:
      - "3002:3000"
    depends_on:
      - api
